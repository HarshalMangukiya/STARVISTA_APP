version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: starvista_postgres
    restart: always
    environment:
      POSTGRES_USER: starvista_user
      POSTGRES_PASSWORD: starvista_password
      POSTGRES_DB: starvista_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starvista_user -d starvista_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: starvista_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starvista_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://starvista_user:starvista_password@postgres:5432/starvista_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: starvista_dev_jwt_access_secret_super_secure_key_12345
      JWT_REFRESH_SECRET: starvista_dev_jwt_refresh_secret_super_secure_key_67890
    ports:
      - '5000:5000'

volumes:
  postgres_data:
  redis_data:
